<div class="demo-area">
  <div class="row" id="out"></div>
</div>

<script src="../../lib/pixelforge.min.js"></script>
<script>
  // The global is PixelForge. From a CDN this would be
  // https://cdn.jsdelivr.net/npm/pixelforge@3/dist/pixelforge.min.js
  const img = new Image();
  img.src = '../../assets/photos/lake-reflection.jpg';
  img.onload = async () => {
    // the same call the 2.x library took; returns a canvas
    const canvas = await PixelForge.pixelate({
      image: img,
      width: 96,
      dither: 'Floyd-Steinberg',
      strength: 60,
      palette: ['#1b1b1e', '#f4f1de', '#e07a5f', '#3d405b', '#81b29a', '#f2cc8f', '#8d5a97', '#ef3054'],
      resolution: 'original',          // 'original' scales back up to the source size, 'pixel' keeps it small
    });
    canvas.className = 'out';
    const fig = document.createElement('figure');
    fig.append(canvas);
    const cap = document.createElement('figcaption');
    cap.textContent = `${canvas.width} Ã— ${canvas.height} canvas`;
    fig.append(cap);
    document.getElementById('out').append(fig);
  };
</script>
