[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "1.0.0"
description = "PixelForge: Hybrid Edge-Aware Pixel Art, Reel Stylization, Game-Asset & Computer-Vision Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmet Deniz Yilmaz"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "numba>=0.58",
    "Pillow>=9.5",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.8",
]

[project.scripts]
pixelforge = "pixelforge.cli:main"
pixelforge-mcp = "pixelforge.mcp_server:run_stdio_server"

[tool.setuptools.packages.find]
include = ["pixelforge*"]

[tool.setuptools.package-data]
pixelforge = ["generalized_sound_triggers.json"]
